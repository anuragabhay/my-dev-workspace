<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orchestrator A2A Brain</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; color: var(--accent); }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .section h2 { font-size: 0.9rem; margin: 0 0 0.5rem; color: var(--muted); }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    input[type="password"], input[type="text"], textarea {
      width: 100%;
      padding: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
    .status.ok { color: var(--success); }
    .status.err { color: var(--warning); }
    .flow-step {
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: var(--bg);
      border-left: 3px solid var(--border);
      border-radius: 0 4px 4px 0;
    }
    .flow-step.proposal { border-left-color: #58a6ff; }
    .flow-step.critique { border-left-color: #d29922; }
    .flow-step.synthesis { border-left-color: #3fb950; }
    .flow-step.decision { border-left-color: #a371f7; }
    .flow-step h3 { font-size: 0.85rem; margin: 0 0 0.5rem; color: var(--muted); }
    .flow-step pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 0.8rem; }
    .error { color: #f85149; }
    .layout { display: flex; gap: 1rem; flex-wrap: wrap; }
    .chat-main { flex: 1; min-width: 280px; }
    .chat-thread { min-height: 200px; margin-bottom: 1rem; }
    .chat-msg { margin-bottom: 0.75rem; padding: 0.5rem; border-radius: 6px; }
    .chat-msg.user { background: var(--surface); border-left: 3px solid var(--accent); }
    .chat-msg.assistant { background: var(--surface); border-left: 3px solid var(--success); }
    .chat-msg pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 0.85rem; }
    .chat-input-row { display: flex; gap: 0.5rem; align-items: flex-end; }
    .chat-input-row textarea { flex: 1; min-height: 60px; }
    .chat-error { color: #f85149; font-size: 0.85rem; margin-top: 0.5rem; }
    .reasoning-panel { width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; }
    .reasoning-panel h2 { font-size: 0.9rem; margin: 0 0 0.5rem; color: var(--muted); }
    .muted { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Orchestrator Chat</h1>
  <p class="status" id="config-status">Checking config…</p>

  <div class="layout">
    <div class="chat-main">
      <div class="chat-thread" id="chat-thread"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Send a message…" rows="2"></textarea>
        <button id="send-btn">Send</button>
      </div>
      <p class="chat-error" id="chat-error" style="display: none;"></p>
    </div>
    <aside class="reasoning-panel" id="reasoning-panel">
      <h2>Reasoning</h2>
      <p class="muted" id="reasoning-hint">Send a message to see proposal, critique, synthesis.</p>
      <div id="reasoning-content" style="display: none;"></div>
    </aside>
  </div>

  <script>
    const API_BASE = '';

    async function checkConfigStatus() {
      const el = document.getElementById('config-status');
      try {
        const r = await fetch(API_BASE + '/api/config-status');
        const d = await r.json();
        const ok = d.api_key_configured && d.workspace_configured;
        el.textContent = ok ? 'Config: OK' : (!d.api_key_configured ? 'Config: missing (set ANTHROPIC_API_KEY in env)' : 'Config: workspace not found');
        el.className = ok ? 'status ok' : 'status err';
      } catch (e) {
        el.textContent = 'Config: unreachable - ' + e.message;
        el.className = 'status err';
      }
    }

    let messages = [];
    const threadEl = document.getElementById('chat-thread');
    const inputEl = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatErrorEl = document.getElementById('chat-error');
    const reasoningContent = document.getElementById('reasoning-content');
    const reasoningHint = document.getElementById('reasoning-hint');

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function renderThread() {
      threadEl.innerHTML = messages.map(m => '<div class="chat-msg ' + m.role + '"><pre>' + escapeHtml(m.content) + '</pre></div>').join('');
      threadEl.scrollTop = threadEl.scrollHeight;
    }

    function showReasoning(flow, toolCalls) {
      reasoningHint.style.display = 'none';
      reasoningContent.style.display = 'block';
      const steps = [
        ['proposal', 'Proposal', flow && flow.proposal],
        ['critique', 'Critique', flow && flow.critique],
        ['synthesis', 'Synthesis', flow && flow.synthesis],
      ];
      reasoningContent.innerHTML = steps.map(([cls, label, text]) =>
        '<div class="flow-step ' + cls + '"><h3>' + label + '</h3><pre>' + escapeHtml(text || '(empty)') + '</pre></div>'
      ).join('') + (toolCalls && toolCalls.length ? '<div class="flow-step"><h3>Tool calls</h3><pre>' + escapeHtml(JSON.stringify(toolCalls, null, 2)) + '</pre></div>' : '');
    }

    async function sendChat() {
      const text = inputEl.value.trim();
      if (!text) return;
      messages.push({ role: 'user', content: text });
      inputEl.value = '';
      renderThread();
      chatErrorEl.style.display = 'none';
      chatErrorEl.textContent = '';
      sendBtn.disabled = true;
      try {
        const r = await fetch(API_BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: messages, include_flow: true }),
        });
        const data = await r.json();
        if (!r.ok) {
          const errMsg = data.error || data.detail || 'Request failed';
          chatErrorEl.textContent = errMsg;
          chatErrorEl.style.display = 'block';
          messages.pop();
          renderThread();
          return;
        }
        messages.push({ role: 'assistant', content: data.reply || '' });
        renderThread();
        showReasoning(data.flow, data.tool_calls);
      } catch (e) {
        chatErrorEl.textContent = e.message || 'Network error';
        chatErrorEl.style.display = 'block';
        messages.pop();
        renderThread();
      } finally {
        sendBtn.disabled = false;
      }
    }

    document.getElementById('send-btn').addEventListener('click', sendChat);
    checkConfigStatus();
  </script>
</body>
</html>
